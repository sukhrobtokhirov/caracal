[versions]
kotlin = "2.3.21"
compose = "1.11.1"
# Material 3 for Compose Multiplatform is released on its own cadence.
composeMaterial3 = "1.9.0"
coroutines = "1.11.0"
pgjdbc = "42.7.13"
hikari = "7.1.0"
slf4j = "2.0.17"
sqlite = "3.53.2.1"
bouncycastle = "1.85.2"
lettuce = "7.7.0.RELEASE"
junit = "5.14.2"
testcontainers = "1.21.4"
kover = "0.9.2"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "pgjdbc" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
bouncycastle = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
compose-material3 = { module = "org.jetbrains.compose.material3:material3-desktop", version.ref = "composeMaterial3" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test-junit4-desktop", version.ref = "compose" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-platform-testkit = { module = "org.junit.platform:junit-platform-testkit" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql", version.ref = "testcontainers" }
testcontainers-core = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
