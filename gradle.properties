# The one place the release version is written. app/build.gradle.kts stamps it into
# the installer and into the build-information resource the About panel and
# `--version` read, and the release workflow refuses a tag that disagrees with it.
version=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
