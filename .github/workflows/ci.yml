name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this same gate against the tagged commit rather
  # than keeping a second copy of it that can drift.
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch makes the running build irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing is a fact worth having about the other two.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Testcontainers needs a Docker daemon. The Linux runner has one; the
          # macOS runner has none, and the Windows runner serves Windows
          # containers only. So Linux is where the integration suites are
          # mandatory, and the other two runners prove the rest of the build is
          # not quietly Linux-specific.
          - os: ubuntu-latest
            integration: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # The toolchain the build asks for in build.gradle.kts.
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :app's Compose tests render offscreen and pass headless, but Skiko on
      # Linux is one native dependency away from needing a screen. A virtual one
      # costs a second and makes all three runners behave alike.
      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb

      - name: Check
        # CARACAL_INTEGRATION is empty on the runners without Docker, which leaves
        # the Testcontainers suites disabled rather than failing. The flag is a
        # declared input of the test task, so setting it re-runs the tests
        # instead of finding them up to date.
        env:
          CARACAL_INTEGRATION: ${{ matrix.integration }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ./gradlew check
          else
            ./gradlew check
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
